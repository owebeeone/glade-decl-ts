name: Publish glade-decl to npm

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing immutable release tag to verify
        required: true

env:
  RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}

permissions:
  contents: read

jobs:
  test:
    name: Test package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10.24.0
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build
      - name: Smoke-test packed consumer install
        run: |
          package_dir=$(mktemp -d)
          pnpm pack --pack-destination "$package_dir"
          package_tarball="owebeeone-glade-decl-$(node -p "require('./package.json').version").tgz"
          mkdir "$package_dir/consumer"
          cd "$package_dir/consumer"
          echo '{ "name": "consumer", "private": true, "type": "module" }' > package.json
          pnpm add "$package_dir/$package_tarball" typescript@5.9.3
          node --input-type=module -e "const m = await import('@owebeeone/glade-decl'); if (typeof m.CONTRACT_VERSION !== 'string') { throw new Error('missing CONTRACT_VERSION export'); }"
          echo 'import type { BindingDecl, ChangeEvent } from "@owebeeone/glade-decl"; export type Checked = [BindingDecl, ChangeEvent];' > check.ts
          pnpm exec tsc --noEmit --strict --module nodenext --skipLibCheck false check.ts

  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10.24.0
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      # pnpm publish packs (applying publishConfig) and then hands the tarball
      # to the npm CLI on PATH, so that CLI decides the auth methods available.
      - name: Select an npm CLI with trusted-publishing support
        run: npm install --global npm@latest
      - name: Require tag/package version agreement
        run: |
          node -e 'const p=require("./package.json"); const t=process.env.RELEASE_TAG.replace(/^v/, ""); if (p.version !== t) throw new Error(`package ${p.version} != tag ${t}`)'
      - name: Publish if this immutable version is absent
        env:
          # A token is needed only to bootstrap the package. Once the package
          # exists, configure npm Trusted Publishing for publish.yml and remove
          # this secret; npm will use the job's OIDC token automatically.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          package_spec=$(node -p "const p=require('./package.json'); p.name + '@' + p.version")
          if pnpm view "$package_spec" version >/dev/null 2>&1; then
            echo "$package_spec is already published"
          else
            pnpm publish --access public --no-git-checks
          fi
